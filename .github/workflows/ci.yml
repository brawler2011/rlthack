name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rlthack
          POSTGRES_PASSWORD: rlthack
          POSTGRES_DB: rlthack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rlthack -d rlthack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rlthack:rlthack@localhost:5432/rlthack_test
      POETRY_VERSION: '2.4.1'
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Check dependency lock
        run: poetry check --lock

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: backend-ci-venv-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-poetry${{ env.POETRY_VERSION }}-${{ hashFiles('backend/poetry.lock', 'backend/pyproject.toml') }}

      - name: Install dependencies
        run: poetry sync --only main,dev --no-root --no-interaction

      - name: Verify lightweight environment and unchanged lock
        run: |
          poetry run python - <<'PY'
          from importlib.metadata import distributions

          heavy = {"torch", "catboost", "sentence-transformers"}
          installed = {dist.metadata["Name"].lower().replace("_", "-") for dist in distributions()}
          unexpected = {name for name in installed if name in heavy or name.startswith(("nvidia-", "cuda-"))}
          assert not unexpected, f"Unexpected ML dependencies in CI: {sorted(unexpected)}"
          PY
          git diff --exit-code -- poetry.lock

      - name: Set up Bun for contract generation
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install contract generator
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Check generated contracts
        run: poetry run python -m scripts.contracts --check

      - name: Run Ruff linter
        run: poetry run ruff check .

      - name: Run Ruff formatter check
        run: poetry run ruff format --check .

      - name: Run backend tests
        run: poetry run pytest tests/ -v

  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-modules-${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock', 'frontend/package.json') }}
          restore-keys: |
            frontend-modules-${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run Prettier check
        run: bun run format:check

      - name: Run TypeCheck & Build
        run: bun run build

      - name: Run API transport tests
        run: bun run test
