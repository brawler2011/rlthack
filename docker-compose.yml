services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rlthack_db
    environment:
      - POSTGRES_USER=rlthack
      - POSTGRES_PASSWORD=rlthack
      - POSTGRES_DB=rlthack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rlthack -d rlthack"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rlthack_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DATABASE_URL=postgresql://rlthack:rlthack@db:5432/rlthack
      - RAW_DATA_DIR=/app/data/Данные 24-25
      - PROCESSED_DATA_DIR=/app/data/processed
      - DICTIONARIES_DIR=/app/data/dictionaries
      - CATBOOST_MODEL_PATH=/app/backend/models/catboost_ranker.cbm
    volumes:
      - ./data:/app/data
      - ./backend/models:/app/backend/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
