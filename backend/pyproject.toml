[tool.poetry]
name = "rlthack-backend"
version = "0.1.0"
description = "Intelligent counterparty matching service for AIS GZ SPb (Roseltorg)"
authors = ["RLT Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.31.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
psycopg = {extras = ["binary", "pool"], version = "^3.2.0"}
polars = "^1.9.0"
catboost = "^1.2.10"
shap = "^0.46.0"
sentence-transformers = "^3.1.1"
rank-bm25 = "^0.2.2"
rapidfuzz = "^3.9.7"
numpy = "^1.26.4"
scikit-learn = "^1.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
httpx = "^0.27.2"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

