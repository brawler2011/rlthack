version: '3'

vars:
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend

tasks:
  default:
    desc: Show list of available commands
    cmds:
      - task --list

  setup:
    desc: Install dependencies for backend (Poetry) and frontend (Bun)
    cmds:
      - task: setup:backend
      - task: setup:frontend

  setup:backend:
    desc: Install backend dependencies via Poetry
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - poetry install

  setup:frontend:
    desc: Install frontend dependencies via Bun
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - bun install

  lint:
    desc: Run all linters (Ruff for Python, ESLint for frontend)
    cmds:
      - task: lint:backend
      - task: lint:frontend

  lint:backend:
    desc: Run Ruff linter check for Python
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - poetry run ruff check .

  lint:frontend:
    desc: Run ESLint check for frontend
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - bun run lint

  format:
    desc: Format all code (Ruff for backend, Prettier for frontend)
    cmds:
      - task: format:backend
      - task: format:frontend

  format:backend:
    desc: Format Python code via Ruff
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - poetry run ruff format .
      - poetry run ruff check --fix .

  format:frontend:
    desc: Format frontend code via Prettier and ESLint fix
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - bun run format
      - bun run lint:fix

  format:check:
    desc: Check code formatting without modifying files
    cmds:
      - task: format:check:backend
      - task: format:check:frontend

  format:check:backend:
    desc: Check Python formatting via Ruff
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - poetry run ruff format --check .

  format:check:frontend:
    desc: Check frontend formatting via Prettier
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - bun run format:check

  test:
    desc: Run all tests
    cmds:
      - task: test:backend

  test:backend:
    desc: Run backend tests (pytest)
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - poetry run pytest tests/ -v

  check:
    desc: Run all CI checks locally (linters, format checks, tests, build)
    cmds:
      - task: lint
      - task: format:check
      - task: test
      - task: build

  build:
    desc: Build production frontend bundle
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - bun run build

  dev:backend:
    desc: Run FastAPI backend in dev mode (port 8000)
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - poetry run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  dev:frontend:
    desc: Run Vite frontend in dev mode (port 5173)
    dir: '{{.FRONTEND_DIR}}'
    cmds:
      - bun run dev

  data:
    desc: Run ETL and build DuckDB database (4.5M rows)
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - poetry run python scripts/01_init_duckdb.py
      - poetry run python scripts/02_aggregate_profiles.py
      - poetry run python scripts/03_enrich_roles.py

  train:
    desc: Build embeddings and train CatBoost ranker
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - poetry run python scripts/04_build_embeddings.py
      - poetry run python scripts/05_train_ranker.py

  up:
    desc: Start all-in-one Docker container (port 8000)
    cmds:
      - docker compose up --build

  down:
    desc: Stop Docker containers
    cmds:
      - docker compose down

  clean:
    desc: Clean temporary files and caches
    cmds:
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - find . -type d -name ".pytest_cache" -exec rm -rf {} +
      - find . -type d -name ".ruff_cache" -exec rm -rf {} +
      - rm -rf .task frontend/dist frontend/tsconfig.tsbuildinfo
